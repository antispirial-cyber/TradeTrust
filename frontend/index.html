<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeTrust - Mumbai Bazaar Trader Reputation Platform</title>
    <!-- Google Fonts: IBM Plex Sans & IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        const s = localStorage.getItem('tradetrust_settings');
        if (s) {
          const parsed = JSON.parse(s);
          if (parsed.themeMode === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
          if (parsed.accentColor) {
            document.documentElement.style.setProperty('--accent-color', parsed.accentColor);
            document.documentElement.style.setProperty('--accent-blue', parsed.accentColor);
            document.documentElement.style.setProperty('--accent-muted', parsed.accentColor + '26');
            document.documentElement.style.setProperty('--accent-hover', parsed.accentColor + 'dd');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
