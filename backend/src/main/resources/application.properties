# Server Configuration
server.port=8080

# Spring MVC / Servlet multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Database Configuration with Environment Variable Fallbacks (Zero password exposed)
db.url=jdbc:mysql://localhost:3306/tradetrust_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=${DB_PASSWORD:}
